# समझो भारत: हर आधे घंटे ब्लॉग की नई पोस्ट और YouTube के नए वीडियो की सूची बनाकर ऐप में डालना
name: Update feed and videos
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data/feed.json and data/videos.json
        run: python3 .github/scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/videos.json
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Auto-update news and videos" && git push; fi
